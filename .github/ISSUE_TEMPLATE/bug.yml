name: Bug report
description: Report a reproducible TACU defect without sharing sensitive data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve TACU. Use synthetic or redacted evidence only. Security vulnerabilities belong in private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: TACU version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (experimental)
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Remove tokens, credentials, personal information, and private paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and the smallest redacted output needed to understand the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Prefer a deterministic synthetic fixture.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, private captures, customer data, and personal information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
