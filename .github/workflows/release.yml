name: Release

# Pushing a version tag publishes the release. Nothing is published from a
# branch, so a release is always a deliberate act: `git push origin v0.3.11`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read the version this tag claims
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      # The tag name reaches Python through the environment, never by string
      # substitution into the script, so a tag can never inject code here.
      - name: Take the release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' > release-notes.md
          import os
          import sys

          sys.path.insert(0, "src")
          from tacu.core import release_notes

          version = os.environ["RELEASE_VERSION"]
          notes = release_notes(version)
          if not notes:
              raise SystemExit(
                  f"CHANGELOG.md has no '## [{version}]' section. "
                  "Add it, or tag the version the changelog documents."
              )
          print(notes)
          PY
      # A release that claims a version the code does not carry is worse than no
      # release, so the tag and src/tacu/__init__.py have to agree.
      - name: Check the tag matches the version in the code
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shipped=$(python -c "import sys; sys.path.insert(0, 'src'); import tacu; print(tacu.__version__)")
          if [ "$shipped" != "$RELEASE_VERSION" ]; then
            echo "Tag $RELEASE_TAG claims $RELEASE_VERSION but src/tacu/__init__.py says $shipped." >&2
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "TACU ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
